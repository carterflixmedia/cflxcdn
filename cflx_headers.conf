# Optimized By Claude AI
#
# Tags each section of the site with a cookie. Included inside the
# www.carterflix.com <VirtualHost>.
#
# How it works:
#  - "Header unset Set-Cookie" removes only the cookies a BACKEND sent.
#    Cookies added with "Header always add" (these section cookies, plus Truth
#    and PREM in the main vhost) are kept.
#  - Each chain is one <If>/<ElseIf> list: the first match wins, so a URL
#    gets exactly one section cookie and blocks can't wipe each other out.
#  - %{REQUEST_URI} is the path only; the query string is not included.


# ----- Section cookies (first match wins) ---------------------------------------
# Paths Apache serves directly are matched from the start of the path.

<If "%{REQUEST_URI} =~ m#^/error#">
    # /error1, /error2, /error3, /error/index2.html
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "TAG=MAINTENANCE; Path=/; Secure; HttpOnly; SameSite=Lax"
</If>
<ElseIf "%{REQUEST_URI} =~ m#^/cloud#">
    # Tag only: the cloud app needs its own session cookie (WCSESSID) in both directions
    Header always add Set-Cookie "ENV=CFLXCLD; Path=/cloud; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#^/hub#">
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "ENV=CFLXHUB; Path=/hub; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#^/apps#">
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "ENV=CFLXAPPS; Path=/apps; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#^/radio#">
    # /radio, /radio1 (live stream), /radio.m3u, /radio.xml
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "ENV=CFLXLIVERADIO; Path=/radio; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#^/ryanators#">
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "CARTERCARES=FORTHEKIDS; Path=/ryanators; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#^/streaming#">
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "ENV=CFLXSTREAMING; Path=/streaming; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#^/tv(/|$)#">
    # RyanatorTV player page. Same cookie as /streaming, scoped to /tv.
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "ENV=CFLXSTREAMING; Path=/tv; Secure; HttpOnly; SameSite=Lax"
</ElseIf>

# Emby web client pages. These still match the word anywhere in the path,
# exactly as before. Tighten them (e.g. m#^/web/home/#) once you've
# confirmed the real paths in your access log.
<ElseIf "%{REQUEST_URI} =~ m#manuallogin#">
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "TAG=Carterflix-Login; Path=/; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#guide#">
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "ENV=CFLXTVGUIDE; Path=/guide; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#search#">
    # Tag only: incoming and backend cookies are kept
    Header always add Set-Cookie "TAG=Carterflix-Search; Path=/; Secure; HttpOnly; SameSite=Lax"
</ElseIf>
<ElseIf "%{REQUEST_URI} =~ m#home#">
    RequestHeader unset Cookie
    Header unset Set-Cookie
    Header always add Set-Cookie "ENV=CFLXPROD2; Path=/; Secure; HttpOnly; SameSite=Lax"
</ElseIf>


# ----- Emby library cookies (first match wins) -----------------------------------
# Tag only, so these stack with the section cookie above. They match only when
