# PROXY RULES v.8.0.0-11232026
#
# Optimized By Claude AI
#
# Included inside the www.carterflix.com <VirtualHost>, BEFORE the main
# vhost's own path rules. For path-level ProxyPass lines the FIRST match wins,
# so within each group the more specific paths come first.
# ${CFLX_EMBY} and ${CFLX_WEB} are defined at the top of the main vhost file.

Define CFLX_IIS http://rcweb2-nic2.carterflix.com


# ----- Radio --------------------------------------------------------------------
# /radio itself is the live Icecast stream. Caching and browser expiry are
# switched off for it in the main vhost and in cflx_cache.conf.
# (/radio1, /radio.m3u and /radio.xml have their own <Location> blocks,
# which take priority over this line.)
ProxyPass         "/radio"  "http://cflx.carterflix.com:8000/stream"
ProxyPassReverse  "/radio"  "http://cflx.carterflix.com:8000/stream"


# ----- Emby ---------------------------------------------------------------------
# Live-update WebSocket
ProxyPass  "/embywebsocket"  "ws://127.0.0.1:8096/embywebsocket"

# API: /emby/... is sent to Emby WITHOUT the /emby prefix (Emby accepts both).
ProxyPass         "/emby/"  "${CFLX_EMBY}/"

# Web client
ProxyPass         "/web"    "${CFLX_EMBY}/web"

# Reverse mappings: /web first, so Emby redirects to /web/... stay /web/...
ProxyPassReverse  "/web"    "${CFLX_EMBY}/web"
ProxyPassReverse  "/emby/"  "${CFLX_EMBY}/"

# Web client files requested from the site root
ProxyPass  "/modules"           "${CFLX_EMBY}/web/modules"
ProxyPass  "/bower_components"  "${CFLX_EMBY}/web/bower_components"
ProxyPass  "/strings"           "${CFLX_EMBY}/web/strings"
ProxyPass  "/startup"           "${CFLX_EMBY}/web/startup"
ProxyPass  "/apploader.js"      "${CFLX_EMBY}/web/apploader.js"
ProxyPass  "/app.js"            "${CFLX_EMBY}/web/app.js"

# (/Branding, /system and /users need no rule: they reach Emby through the
#  catch-all "ProxyPass /" in the main vhost.)


# ----- CarterFLIX CLOUD (IIS) assets at the site root ---------------------------
ProxyPass  "/bg.jpg"            "${CFLX_WEB}/bg.jpg"

ProxyPass  "/Logout.aspx"       "${CFLX_IIS}/cloud/Logout.aspx"
ProxyPass  "/AdminPanel.aspx"   "${CFLX_IIS}/cloud/AdminPanel.aspx"
ProxyPass  "/Diagnostics.aspx"  "${CFLX_IIS}/cloud/Diagnostics.aspx"
ProxyPass  "/Scripts"           "${CFLX_IIS}/cloud/Scripts"
ProxyPass  "/Images"            "${CFLX_IIS}/cloud/Images"
ProxyPass  "/Handlers"          "${CFLX_IIS}/cloud/Handlers"
ProxyPass  "/DemoFolder"        "${CFLX_IIS}/cloud/DemoFolder"
ProxyPass  "/NewFileTemplates"  "${CFLX_IIS}/cloud/NewFileTemplates"
ProxyPass  "/Styles-min.css"    "${CFLX_IIS}/cloud/Styles-min.css"

ProxyPassReverse  "/Logout.aspx"       "${CFLX_IIS}/cloud/Logout.aspx"
ProxyPassReverse  "/AdminPanel.aspx"   "${CFLX_IIS}/cloud/AdminPanel.aspx"
ProxyPassReverse  "/Diagnostics.aspx"  "${CFLX_IIS}/cloud/Diagnostics.aspx"

# Admin pages: home networks only. Everyone else gets 403 (the /error2 page).
# (?i) = any capitalisation, because IIS ignores case.
<LocationMatch "(?i)^/(AdminPanel|Diagnostics)\.aspx">
    Require ip 192.168.4.0/24 192.168.1.0/24
</LocationMatch>

# Cloud error page for the root-level cloud paths
<LocationMatch "^/(bg\.jpg|Logout\.aspx|AdminPanel\.aspx|Diagnostics\.aspx|Scripts|Images|Handlers|DemoFolder|NewFileTemplates|Styles-min\.css)">
    ErrorDocument 400 /error2
    ErrorDocument 403 /error2
    ErrorDocument 404 /error2
    ErrorDocument 405 /error2
    ErrorDocument 408 /error2
    ErrorDocument 413 /error2
    ErrorDocument 414 /error2
    ErrorDocument 500 /error2
    ErrorDocument 501 /error2
    ErrorDocument 502 /error2
    ErrorDocument 503 /error2
    ErrorDocument 504 /error2
    ErrorDocument 505 /error2
</LocationMatch>
