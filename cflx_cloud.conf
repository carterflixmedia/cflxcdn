# ----- The app ----------------------------------------------------------------
<Location /cloud>
    ProxyPass         ${CFLX_CLOUD}/cloud  nocanon timeout=3600 keepalive=On
    ProxyPassReverse  ${CFLX_CLOUD}/cloud

    # No size cap on request bodies. Apache 2.4.54+ defaults to 1 GB, which
    # would block big WebDAV uploads.
    LimitRequestBody 0

    # Pass the app's own JSON and WebDAV errors (404, 409, 423...) through
    # unchanged. Only replace "backend is down" errors with the error page.
    ProxyErrorOverride On 502 503 504
    ErrorDocument 502 /error2
    ErrorDocument 503 /error2
    ErrorDocument 504 /error2

    # No compression: it breaks video seeking (byte ranges) and buffers ZIP
    # downloads and WebDAV transfers.
    SetEnv no-gzip 1
    SetEnv dont-vary 1

    # Site-wide headers that don't suit this app:
    # - CORS "*" isn't needed (same-origin only).
    # - The site-wide CSP replaced the app's stricter one; put it back.
    Header unset Access-Control-Allow-Origin
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
</Location>

# Files served from the shares (downloads, previews, WebDAV): nothing in them
# may run scripts.
<LocationMatch "^/cloud/(file\.php|dav\.php|webdav/|hcwebdav/)">
    Header always set Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'self'"
</LocationMatch>

# ----- Old HTTP Commander entry points ----------------------------------------
# The backend answers these with a redirect to https://www.carterflix.com/cloud/
<Location /Default.aspx>
    ProxyPass         ${CFLX_CLOUD}/cloud/Default.aspx
    ProxyPassReverse  ${CFLX_CLOUD}/cloud/Default.aspx
</Location>
<Location /SyncWebFolders.html>
    ProxyPass         ${CFLX_CLOUD}/cloud/SyncWebFolders.html
    ProxyPassReverse  ${CFLX_CLOUD}/cloud/SyncWebFolders.html
</Location>
# Old HTTP Commander public links can't be carried over; they land on /cloud/.
<Location /public/>
    ProxyPass         ${CFLX_CLOUD}/cloud/public/
    ProxyPassReverse  ${CFLX_CLOUD}/cloud/public/
</Location>
