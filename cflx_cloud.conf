# =============================================================================
# cflx_cloud.conf – FRONT reverse proxy for WebCommander (Carterflix Cloud)
#
# Goes on the MAIN proxy server, e.g.
#   Debian/Ubuntu: /etc/apache2/sites-available/cflx_cloud.conf  ->  a2ensite cflx_cloud
#   RHEL family:   /etc/httpd/conf.d/cflx_cloud.conf
#
# Required modules on the proxy:
#   a2enmod proxy proxy_http headers rewrite ssl
#
# TLS ends here; the proxy talks plain HTTP to the WebCommander server on the
# LAN. The WebCommander server must use deploy/webcommander-backend.conf (no
# HTTPS redirect there, otherwise you get a redirect loop).
# =============================================================================

# ---- EDIT THESE TWO LINES ---------------------------------------------------
Define CFLX_CLOUD_HOST     rcweb4.carterflix.com
Define CFLX_CLOUD_BACKEND  http://192.168.4.30:80
# -----------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName ${CFLX_CLOUD_HOST}

    RewriteEngine On
    # Let certbot (HTTP-01) through; everything else goes to HTTPS.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${CFLX_CLOUD_HOST}

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/${CFLX_CLOUD_HOST}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${CFLX_CLOUD_HOST}/privkey.pem

    # ---- big uploads, long downloads, WebDAV --------------------------------
    # no size cap (Apache 2.4.54+ defaults to 1 GB)
    LimitRequestBody 0
    Timeout          3600
    ProxyTimeout     3600

    # File names with %, #, ?, + or %2F must reach the app exactly as sent
    # (WebDAV clients encode them in the path).
    AllowEncodedSlashes NoDecode

    # ---- reverse proxy ------------------------------------------------------
    ProxyRequests     Off
    # app builds share links / WebDAV URLs from Host
    ProxyPreserveHost On
    # X-Forwarded-For / -Host / -Server
    ProxyAddHeaders   On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Basic auth for WebDAV must be passed on untouched
    # (mod_proxy forwards Authorization by default – do not strip it).

    ProxyPass        /  ${CFLX_CLOUD_BACKEND}/  nocanon keepalive=On retry=5
    ProxyPassReverse /  ${CFLX_CLOUD_BACKEND}/
    # In case the backend ever emits an absolute http:// URL for our own host
    ProxyPassReverse /  http://${CFLX_CLOUD_HOST}/

    # ---- streaming -----------------------------------------------------------
    # Don't let mod_deflate buffer/compress downloads, ZIP streams, video or WebDAV.
    SetEnv no-gzip 1
    SetEnv dont-vary 1

    # ---- security headers (the app sets CSP / nosniff / frame options itself) -
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/cflx_cloud-error.log
    CustomLog ${APACHE_LOG_DIR}/cflx_cloud-access.log combined
</VirtualHost>
