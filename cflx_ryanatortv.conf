# RYANATOR TV PROXY RULES v.2.0.0-11232026
#
# Optimized By Claude AI
#

# ----- IPTV backend (port 8409) -----------------------------------------------
# Covers every /iptv/... path: channels.m3u, channel/N.m3u8,
# session/N/hls.m3u8, session/N/live.m3u8, the segments, and so on.
ProxyPass         "/iptv/"  "http://cflxproxy.carterflix.com:8409/iptv/"
ProxyPassReverse  "/iptv/"  "http://cflxproxy.carterflix.com:8409/iptv/"

# WebSocket. Delete this if your access log never shows /ws/.
ProxyPass         "/ws/"    "ws://cflxproxy.carterflix.com:8409/ws/"


# ----- RyanatorTV player page ----------------------------------------------------
# Four public URLs, one page.
<Location /ryanator>
    ProxyPass         ${CFLX_WEB}/live/ryanators.html
    ProxyPassReverse  ${CFLX_WEB}/live/ryanators.html
</Location>
<Location /ryanators>
    ProxyPass         ${CFLX_WEB}/live/ryanators.html
    ProxyPassReverse  ${CFLX_WEB}/live/ryanators.html
</Location>
<Location /ryanatortv>
    ProxyPass         ${CFLX_WEB}/live/ryanators.html
    ProxyPassReverse  ${CFLX_WEB}/live/ryanators.html
</Location>
<Location /tv>
    ProxyPass         ${CFLX_WEB}/live/ryanators.html
    ProxyPassReverse  ${CFLX_WEB}/live/ryanators.html
</Location>

# RyanatorTV error page for all four URLs
<LocationMatch "^/(ryanators?|ryanatortv|tv)(/|$)">
    ErrorDocument 400 /error3
    ErrorDocument 403 /error3
    ErrorDocument 404 /error3
    ErrorDocument 405 /error3
    ErrorDocument 408 /error3
    ErrorDocument 413 /error3
    ErrorDocument 414 /error3
    ErrorDocument 500 /error3
    ErrorDocument 501 /error3
    ErrorDocument 502 /error3
    ErrorDocument 503 /error3
    ErrorDocument 504 /error3
    ErrorDocument 505 /error3
</LocationMatch>


# ----- Player support files ----------------------------------------------------
# Only these exact files under /live/ are reachable.
ProxyPassMatch    "^/live/(preloader\.html|preloader\.css|videoerror\.html|viderrorscript\.js|viderrorstyle\.css|templatemo_style\.css)$"  "${CFLX_WEB}/live/$1"
ProxyPassReverse  "/live/"  "${CFLX_WEB}/live/"
