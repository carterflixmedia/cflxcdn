# MIME Cache Rules v.8.0.0-11232026
#
# Optimized By Claude AI
#
# Sets browser cache lifetimes (Expires / Cache-Control: max-age) by
# content type. Included inside the www.carterflix.com <VirtualHost>.
#
# mod_expires leaves a response alone when the backend already sent its
# own Expires header, so these rules only fill in where the backend didn't.

ExpiresActive On

# Don't add "public" here: it would let shared caches store private pages.
#        Header set Cache-Control "public"


# ----- Block bots ------------------------------------------------------------
SetEnvIfNoCase User-Agent "MJ12bot"     bad_bots
SetEnvIfNoCase User-Agent "AhrefsBot"   bad_bots
SetEnvIfNoCase User-Agent "SemrushBot"  bad_bots
SetEnvIfNoCase User-Agent "Baiduspider" bad_bots

<Location />
    <RequireAll>
        Require all granted
        Require not env bad_bots
    </RequireAll>
</Location>


# ----- Pages and data: short, so changes show up quickly ----------------------
# HTML: your pages, the IIS cloud pages, the Emby web client's index.html
ExpiresByType text/html                      "access plus 5 minutes"

# JSON: /status.json and API replies. Browsers revalidate every time.
ExpiresByType application/json               "access plus 0 seconds"

# XML: radio.xml, the IPTV guide (xmltv.xml)
ExpiresByType application/xml                "access plus 5 minutes"
ExpiresByType text/xml                       "access plus 5 minutes"

# Streaming playlists: must stay fresh or live TV stalls
ExpiresByType application/vnd.apple.mpegurl  "access plus 0 seconds"
ExpiresByType application/x-mpegURL          "access plus 0 seconds"
ExpiresByType audio/x-mpegurl                "access plus 0 seconds"


# ----- Static assets: long -----------------------------------------------------
# CSS and JavaScript
ExpiresByType text/css                       "access plus 1 week"
ExpiresByType application/javascript         "access plus 1 week"
ExpiresByType text/javascript                "access plus 1 week"

# Fonts
ExpiresByType font/woff2                     "access plus 4 weeks"
ExpiresByType font/woff                      "access plus 4 weeks"
ExpiresByType application/font-woff          "access plus 4 weeks"

# Images
ExpiresByType image/gif                      "access plus 4 weeks"
ExpiresByType image/jpeg                     "access plus 4 weeks"
ExpiresByType image/png                      "access plus 4 weeks"
ExpiresByType image/webp                     "access plus 4 weeks"
ExpiresByType image/svg+xml                  "access plus 4 weeks"
ExpiresByType image/x-icon                   "access plus 4 weeks"
ExpiresByType image/vnd.microsoft.icon       "access plus 4 weeks"

# Audio
ExpiresByType audio/mpeg                     "access plus 4 weeks"
ExpiresByType audio/mp4                      "access plus 4 weeks"
ExpiresByType audio/aac                      "access plus 4 weeks"
ExpiresByType audio/ogg                      "access plus 4 weeks"
ExpiresByType audio/flac                     "access plus 4 weeks"

# Video
ExpiresByType video/mp4                      "access plus 4 weeks"
ExpiresByType video/webm                     "access plus 4 weeks"
ExpiresByType video/ogg                      "access plus 4 weeks"
ExpiresByType video/mp2t                     "access plus 1 day"


# ----- Exceptions ----------------------------------------------------------------
# The live radio streams (/radio and /radio1) are audio/mpeg but must never be
# cached. Pages under /radio/ keep their normal rules.
<LocationMatch "^/radio1?$">
    ExpiresActive Off
</LocationMatch>
